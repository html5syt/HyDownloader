publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.8
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  dio: ^5.11.1
  path_provider: ^2.1.6
  file_picker: ^13.3.0
  audioplayers: ^6.8.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  provider: ^6.1.5+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
