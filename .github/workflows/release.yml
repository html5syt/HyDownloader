name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.1"
  APP_NAME: HyDownloader

jobs:
  build_release_android:
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Android Release APK
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/${APP_NAME}-android-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*

  build_release_windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows Release
        shell: powershell
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\${env:APP_NAME}-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  build_release_linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Linux Release
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release
          mkdir -p dist
          tar -czf dist/${APP_NAME}-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  build_release_apple:
    name: Build macOS & iOS Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build macOS and unsigned iOS
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
          flutter build ios --release --no-codesign
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/HyDownloader.app dist/${APP_NAME}-macos-universal.zip || true
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/${APP_NAME}-ios-unsigned.zip || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: dist/*

  publish_release:
    name: Publish GitHub Release
    needs: [build_release_android, build_release_windows, build_release_linux, build_release_apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: release-dist/*
          draft: false
          prerelease: false
