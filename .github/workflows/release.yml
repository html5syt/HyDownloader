name: Release

on:
  push:
    branches:
      - "master"
      - "main"
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.1"
  APP_NAME: HyDownloader

jobs:
  release_metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.metadata.outputs.should_release }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      release_title: ${{ steps.metadata.outputs.release_title }}
      release_body: ${{ steps.metadata.outputs.release_body }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      draft: ${{ steps.metadata.outputs.draft }}
      release_source: ${{ steps.metadata.outputs.release_source }}
      app_version: ${{ steps.metadata.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: metadata
        name: Parse commit metadata or tag
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_MESSAGE="$(git log -1 --format=%B "$GITHUB_SHA")"
          export COMMIT_MESSAGE

          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys

          message = os.environ.get("COMMIT_MESSAGE", "")
          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          sha = os.environ.get("GITHUB_SHA", "HEAD")
          output_path = os.environ["GITHUB_OUTPUT"]

          title = message.splitlines()[0].strip() if message.splitlines() else ref_name
          semver_tag = re.compile(r"^v\d+\.\d+\.\d+$")
          release_meta = re.compile(
              r"\[release\s+ver=\"(v\d+\.\d+\.\d+)\"\s*,\s*pre=(true|false)\s*,\s*draft=(true|false)\]"
          )

          should_release = False
          tag_name = ""
          prerelease = "false"
          draft = "false"
          release_source = "none"
          release_title = title or ref_name
          manual_body = "\n".join(message.splitlines()[1:])

          if ref.startswith("refs/tags/"):
              if semver_tag.fullmatch(ref_name):
                  should_release = True
                  tag_name = ref_name
                  prerelease = "false"
                  draft = "true"
                  release_source = "tag"
                  release_title = ref_name
              else:
                  print(f"Skipping non-release tag: {ref_name}")
          else:
              match = release_meta.search(message)
              if match:
                  should_release = True
                  tag_name = match.group(1)
                  prerelease = match.group(2)
                  draft = match.group(3)
                  release_source = "commit"
                  release_title = title
              elif "[release" in message:
                  print(
                      "::error::Release metadata must match "
                      '[release ver="vx.x.x",pre=false,draft=false]'
                  )
                  sys.exit(1)

          manual_body = release_meta.sub("", manual_body).strip()

          previous_tag_result = subprocess.run(
              [
                  "git",
                  "describe",
                  "--tags",
                  "--match",
                  "v[0-9]*.[0-9]*.[0-9]*",
                  "--abbrev=0",
                  f"{sha}^",
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          previous_tag = previous_tag_result.stdout.strip()
          revision_range = f"{previous_tag}..{sha}" if previous_tag else sha
          log_result = subprocess.run(
              [
                  "git",
                  "log",
                  revision_range,
                  "--format=%H%x1f%h%x1f%s%x1f%aN",
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          commits = []
          contributors = []
          contributor_keys = set()
          for row in log_result.stdout.splitlines():
              parts = row.split("\x1f", 3)
              if len(parts) != 4:
                  continue
              full_sha, short_sha, subject, author = parts
              commit_url = f"{server_url}/{repository}/commit/{full_sha}"
              commits.append(
                  f"- [`{short_sha}`]({commit_url}) {subject} - {author}"
              )
              author_key = author.casefold()
              if author_key not in contributor_keys:
                  contributor_keys.add(author_key)
                  contributors.append(author)

          generated_sections = []
          if commits:
              generated_sections.append(
                  "## 提交记录\n\n" + "\n".join(commits)
              )
          if contributors:
              generated_sections.append(
                  "## 贡献者\n\n"
                  + "\n".join(f"- {author}" for author in contributors)
              )

          release_body_parts = []
          if manual_body:
              release_body_parts.append(manual_body)
          if generated_sections:
              release_body_parts.append("\n\n".join(generated_sections))

          release_body = "\n\n".join(part for part in release_body_parts if part)
          if not release_body:
              release_body = f"Automated release for {tag_name}."

          with open(output_path, "a", encoding="utf-8") as fh:
              fh.write(f"should_release={'true' if should_release else 'false'}\n")
              fh.write(f"tag_name={tag_name}\n")
              fh.write(f"prerelease={prerelease}\n")
              fh.write(f"draft={draft}\n")
              fh.write(f"release_source={release_source}\n")
              fh.write(f"app_version={tag_name}\n")
              fh.write("release_title<<__RELEASE_TITLE__\n")
              fh.write(f"{release_title}\n")
              fh.write("__RELEASE_TITLE__\n")
              fh.write("release_body<<__RELEASE_BODY__\n")
              fh.write(f"{release_body}\n")
              fh.write("__RELEASE_BODY__\n")

          print(f"should_release={should_release}")
          print(f"release_source={release_source}")
          print(f"tag_name={tag_name}")
          print(f"prerelease={prerelease}")
          print(f"draft={draft}")
          print(f"release_title={release_title}")
          PY

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: release_metadata
    if: needs.release_metadata.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Android release artifacts
        run: |
          VERSION='${{ needs.release_metadata.outputs.app_version }}'
          flutter pub get
          flutter build apk --release --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/${APP_NAME}-android-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*

  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: release_metadata
    if: needs.release_metadata.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-good1.0-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Linux
        run: |
          VERSION='${{ needs.release_metadata.outputs.app_version }}'
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          tar -czf artifacts/${APP_NAME}-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*

  windows:
    name: Windows
    runs-on: windows-latest
    needs: release_metadata
    if: needs.release_metadata.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows
        shell: powershell
        run: |
          $version = '${{ needs.release_metadata.outputs.app_version }}'
          $buildName = $version.TrimStart('v')
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --build-name=$buildName --dart-define=APP_VERSION=$version
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath artifacts\${env:APP_NAME}-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*

  apple:
    name: macOS and iOS
    runs-on: macos-latest
    needs: release_metadata
    if: needs.release_metadata.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build macOS
        run: |
          VERSION='${{ needs.release_metadata.outputs.app_version }}'
          BUILD_NAME="${VERSION#v}"
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --build-name="$BUILD_NAME" --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          MACOS_APP="$(find build/macos/Build/Products -name '*.app' -print -quit)"
          if [ -n "$MACOS_APP" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$MACOS_APP" artifacts/${APP_NAME}-macos.zip
          fi

      - name: Build unsigned iOS
        run: |
          VERSION='${{ needs.release_metadata.outputs.app_version }}'
          BUILD_NAME="${VERSION#v}"
          flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --dart-define=APP_VERSION="$VERSION"
          mkdir -p artifacts
          IOS_APP="$(find build/ios -name '*.app' -print -quit)"
          if [ -n "$IOS_APP" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$IOS_APP" artifacts/${APP_NAME}-ios-unsigned.zip
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: artifacts/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: needs.release_metadata.outputs.should_release == 'true'
    needs:
      - release_metadata
      - android
      - linux
      - windows
      - apple
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release files
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.tag_name }}
          name: ${{ needs.release_metadata.outputs.release_title }}
          draft: ${{ needs.release_metadata.outputs.draft == 'true' }}
          prerelease: ${{ needs.release_metadata.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.release_metadata.outputs.release_body }}
          files: dist/*
